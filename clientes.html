<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - ERP Cuba</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #1a5276; --dark: #2c3e50; --light: #ecf0f1; --success: #27ae60; --danger: #c0392b; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--light); }
        .app { display: flex; min-height: 100vh; }
        
        .sidebar { width: 260px; background: var(--dark); color: white; position: fixed; height: 100vh; left: 0; top: 0; z-index: 100; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h3 { font-size: 16px; }
        .sidebar-header small { opacity: 0.7; font-size: 12px; }
        .sidebar-nav { padding: 15px 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .sidebar-footer { padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.1); position: absolute; bottom: 0; width: 100%; }
        .btn-logout { width: 100%; padding: 10px; background: rgba(255,255,255,0.1); color: white; border: none; border-radius: 8px; cursor: pointer; }
        .btn-logout:hover { background: var(--danger); }
        
        .main { flex: 1; margin-left: 260px; padding: 20px; }
        .topbar { background: white; padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .topbar h1 { font-size: 20px; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-bar input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
        th { background: var(--light); }
        .badge { padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; }
        .badge.activo { background: #d5f5e3; color: var(--success); }
        .badge.inactivo { background: #e0e0e0; color: #666; }
        .btn-icon { background: none; border: none; font-size: 16px; cursor: pointer; margin: 0 3px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; max-width: 550px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-secondary { background: #95a5a6; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
        .menu-btn { display: none; background: none; border: none; font-size: 24px; cursor: pointer; }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-260px); transition: 0.3s; }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; }
            .menu-btn { display: block; }
            .form-row { grid-template-columns: 1fr; }
            .search-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3 id="proyectoNombre">🇨🇺 ERP Cuba</h3>
                <small id="userNombre"></small>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="clientes.html" class="nav-item active">👥 Clientes</a>
                <a href="trabajadores.html" class="nav-item">👷 Trabajadores</a>
                <a href="proyectos.html" class="nav-item">🏗️ Proyectos</a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout" onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
            </div>
        </aside>
        
        <main class="main">
            <div class="topbar">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <h1>👥 Gestión de Clientes</h1>
                <button class="btn-primary" onclick="abrirModal()">➕ Nuevo Cliente</button>
            </div>
            
            <div class="search-bar">
                <input type="text" id="busqueda" placeholder="🔍 Buscar cliente..." onkeyup="cargarClientes()">
            </div>
            
            <div class="section">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Provincia</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="clientesBody"></tbody>
                </table>
            </div>
        </main>
    </div>
    
    <div class="modal" id="modalCliente">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitulo">➕ Nuevo Cliente</h2>
                <button class="modal-close" onclick="cerrarModal()">&times;</button>
            </div>
            <form id="formCliente" onsubmit="return false;">
                <input type="hidden" id="clienteId">
                <div class="form-group">
                    <label>👤 Nombre *</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>🆔 Carnet</label>
                        <input type="text" id="carnet">
                    </div>
                    <div class="form-group">
                        <label>📱 Teléfono</label>
                        <input type="tel" id="telefono">
                    </div>
                </div>
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="email">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>📍 Provincia</label>
                        <select id="provincia">
                            <option value="">Seleccionar</option>
                            <option>Pinar del Río</option><option>Artemisa</option><option>La Habana</option>
                            <option>Mayabeque</option><option>Matanzas</option><option>Cienfuegos</option>
                            <option>Villa Clara</option><option>Sancti Spíritus</option><option>Ciego de Ávila</option>
                            <option>Camagüey</option><option>Las Tunas</option><option>Holguín</option>
                            <option>Granma</option><option>Santiago de Cuba</option><option>Guantánamo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🏘️ Municipio</label>
                        <input type="text" id="municipio">
                    </div>
                </div>
                <div class="form-group">
                    <label>📝 Dirección</label>
                    <input type="text" id="direccion">
                </div>
                <div class="form-group">
                    <label>📋 Notas</label>
                    <input type="text" id="notas">
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="activo" checked> Cliente Activo</label>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-primary" onclick="guardarCliente()">💾 Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script>
        var usuarioActual = null;
        
        function verificarSesion() {
            var sesion = localStorage.getItem('erp_sesion') || sessionStorage.getItem('erp_sesion');
            if (!sesion) { window.location.href = 'login.html'; return; }
            usuarioActual = JSON.parse(sesion);
            document.getElementById('proyectoNombre').textContent = usuarioActual.proyecto;
            document.getElementById('userNombre').textContent = usuarioActual.nombre;
        }
        
        function cargarClientes() {
            var busqueda = document.getElementById('busqueda').value.toLowerCase();
            var clientes = STORAGE.buscar('clientes', 'proyecto', usuarioActual.proyecto);
            
            if (busqueda) {
                clientes = clientes.filter(function(c) {
                    return (c.nombre || '').toLowerCase().includes(busqueda) ||
                           (c.telefono || '').includes(busqueda) ||
                           (c.carnet_identidad || '').includes(busqueda);
                });
            }
            
            var tbody = document.getElementById('clientesBody');
            if (clientes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No hay clientes</td></tr>';
                return;
            }
            
            tbody.innerHTML = clientes.map(function(c) {
                return '<tr>' +
                    '<td><strong>' + (c.nombre || '') + '</strong></td>' +
                    '<td>' + (c.telefono || '-') + '</td>' +
                    '<td>' + (c.provincia || '-') + '</td>' +
                    '<td><span class="badge ' + (c.activo !== false ? 'activo' : 'inactivo') + '">' + (c.activo !== false ? 'Activo' : 'Inactivo') + '</span></td>' +
                    '<td>' +
                        '<button class="btn-icon" onclick="editarCliente(\'' + c.id + '\')">✏️</button>' +
                        '<button class="btn-icon" onclick="toggleCliente(\'' + c.id + '\')">' + (c.activo !== false ? '🔴' : '🟢') + '</button>' +
                    '</td>' +
                '</tr>';
            }).join('');
        }
        
        function abrirModal() {
            document.getElementById('modalTitulo').textContent = '➕ Nuevo Cliente';
            document.getElementById('formCliente').reset();
            document.getElementById('clienteId').value = '';
            document.getElementById('modalCliente').classList.add('active');
        }
        
        function cerrarModal() {
            document.getElementById('modalCliente').classList.remove('active');
        }
        
        function editarCliente(id) {
            var clientes = STORAGE.todos('clientes');
            var cliente = clientes.find(function(c) { return c.id === id; });
            if (!cliente) return;
            
            document.getElementById('modalTitulo').textContent = '✏️ Editar Cliente';
            document.getElementById('clienteId').value = cliente.id;
            document.getElementById('nombre').value = cliente.nombre || '';
            document.getElementById('carnet').value = cliente.carnet_identidad || '';
            document.getElementById('telefono').value = cliente.telefono || '';
            document.getElementById('email').value = cliente.email || '';
            document.getElementById('provincia').value = cliente.provincia || '';
            document.getElementById('municipio').value = cliente.municipio || '';
            document.getElementById('direccion').value = cliente.direccion || '';
            document.getElementById('notas').value = cliente.notas || '';
            document.getElementById('activo').checked = cliente.activo !== false;
            document.getElementById('modalCliente').classList.add('active');
        }
        
        function guardarCliente() {
            var id = document.getElementById('clienteId').value;
            var datos = {
                proyecto: usuarioActual.proyecto,
                nombre: document.getElementById('nombre').value,
                carnet_identidad: document.getElementById('carnet').value,
                telefono: document.getElementById('telefono').value,
                email: document.getElementById('email').value,
                provincia: document.getElementById('provincia').value,
                municipio: document.getElementById('municipio').value,
                direccion: document.getElementById('direccion').value,
                notas: document.getElementById('notas').value,
                activo: document.getElementById('activo').checked
            };
            
            if (id) {
                STORAGE.actualizar('clientes', id, datos);
            } else {
                STORAGE.agregar('clientes', datos);
            }
            
            cerrarModal();
            cargarClientes();
        }
        
        function toggleCliente(id) {
            var clientes = STORAGE.todos('clientes');
            var cliente = clientes.find(function(c) { return c.id === id; });
            if (cliente) {
                STORAGE.actualizar('clientes', id, { activo: !(cliente.activo !== false) });
                cargarClientes();
            }
        }
        
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function cerrarSesion() { localStorage.removeItem('erp_sesion'); sessionStorage.removeItem('erp_sesion'); window.location.href = 'login.html'; }
        
        verificarSesion();
        cargarClientes();
    </script>
</body>
</html>
