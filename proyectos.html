<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos - ERP Cuba</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #ecf0f1; }
        
        /* Sidebar */
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; position: fixed; left: 0; top: 0; padding: 20px 0; z-index: 100; }
        .sidebar h3 { padding: 0 20px 15px; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 10px; }
        .sidebar a { display: block; padding: 12px 20px; color: white; text-decoration: none; font-size: 14px; }
        .sidebar a:hover, .sidebar a.active { background: #1a5276; }
        .sidebar button { margin: 10px 20px; padding: 10px; width: calc(100% - 40px); background: #c0392b; color: white; border: none; border-radius: 5px; cursor: pointer; }
        
        /* Main */
        .main { margin-left: 250px; padding: 20px; }
        .topbar { background: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #1a5276; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
        
        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-bottom: 10px; color: #2c3e50; }
        .card p { margin: 5px 0; font-size: 13px; color: #555; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .Pendiente { background: #fdebd0; color: #f39c12; }
        .En.Progreso { background: #d6eaf8; color: #2980b9; }
        .Completado { background: #d5f5e3; color: #27ae60; }
        .Cancelado { background: #e0e0e0; color: #666; }
        .Alta { background: #fadbd8; color: #e74c3c; }
        .Media { background: #fdebd0; color: #f39c12; }
        .Baja { background: #d5f5e3; color: #27ae60; }
        .card-actions { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
        .card-actions button { margin-right: 5px; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-box { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 550px; max-height: 80vh; overflow-y: auto; }
        .modal-box h2 { margin-bottom: 15px; }
        .modal-box label { display: block; margin: 10px 0 5px; font-weight: bold; font-size: 13px; }
        .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 10px; }
        .modal-box .row { display: flex; gap: 10px; }
        .modal-box .row > div { flex: 1; }
        .modal-actions { text-align: right; margin-top: 15px; }
        .modal-actions button { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; margin-left: 5px; }
        
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .filter-bar input, .filter-bar select { padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
        .filter-bar input { flex: 1; }
        
        @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; } }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h3 id="proyectoNombre">🇨🇺 ERP Cuba</h3>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="clientes.html">👥 Clientes</a>
        <a href="trabajadores.html">👷 Trabajadores</a>
        <a href="proyectos.html" class="active">🏗️ Proyectos</a>
        <br><br>
        <button onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
    </div>
    
    <!-- Main -->
    <div class="main">
        <div class="topbar">
            <h1>🏗️ Proyectos</h1>
            <button class="btn" onclick="abrirModal()">➕ Nuevo Proyecto</button>
        </div>
        
        <div class="filter-bar">
            <input type="text" id="busqueda" placeholder="🔍 Buscar..." oninput="cargar()">
            <select id="filtroEstado" onchange="cargar()">
                <option value="">Todos</option>
                <option>Pendiente</option>
                <option>En Progreso</option>
                <option>Completado</option>
                <option>Cancelado</option>
            </select>
        </div>
        
        <div class="grid" id="proyectosGrid"></div>
    </div>
    
    <!-- Modal -->
    <div class="modal" id="modalProyecto">
        <div class="modal-box">
            <h2 id="modalTitulo">➕ Nuevo Proyecto</h2>
            <input type="hidden" id="proyectoId">
            
            <label>📋 Nombre *</label>
            <input type="text" id="nombre" required>
            
            <div class="row">
                <div><label>👥 Cliente</label><select id="cliente_id"></select></div>
                <div><label>📊 Estado</label><select id="estado"><option>Pendiente</option><option>En Progreso</option><option>Completado</option><option>Cancelado</option></select></div>
            </div>
            
            <div class="row">
                <div><label>⚠️ Prioridad</label><select id="prioridad"><option>Baja</option><option selected>Media</option><option>Alta</option><option>Urgente</option></select></div>
                <div><label>💰 Moneda</label><select id="moneda"><option>CUP</option><option>USD</option></select></div>
            </div>
            
            <div class="row">
                <div><label>📅 Inicio</label><input type="date" id="fecha_inicio"></div>
                <div><label>📅 Fin</label><input type="date" id="fecha_fin"></div>
            </div>
            
            <div class="row">
                <div><label>💰 Presupuesto CUP</label><input type="number" id="presupuesto_cup" step="0.01"></div>
                <div><label>💵 Presupuesto USD</label><input type="number" id="presupuesto_usd" step="0.01"></div>
            </div>
            
            <label>📝 Descripción</label>
            <textarea id="descripcion" rows="2"></textarea>
            
            <div class="modal-actions">
                <button style="background:#95a5a6;color:white;" onclick="cerrarModal()">Cancelar</button>
                <button style="background:#1a5276;color:white;" onclick="guardar()">💾 Guardar</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script>
        var usuarioActual = null;
        
        // Verificar sesión
        var sesion = localStorage.getItem('erp_sesion') || sessionStorage.getItem('erp_sesion');
        if (!sesion) { window.location.href = 'login.html'; }
        usuarioActual = JSON.parse(sesion);
        document.getElementById('proyectoNombre').textContent = usuarioActual.proyecto || 'ERP Cuba';
        
        function cargar() {
            var busqueda = document.getElementById('busqueda').value.toLowerCase();
            var filtro = document.getElementById('filtroEstado').value;
            var proyectos = STORAGE.buscar('proyectos', 'proyecto', usuarioActual.proyecto);
            var clientes = STORAGE.buscar('clientes', 'proyecto', usuarioActual.proyecto);
            
            if (busqueda) { proyectos = proyectos.filter(function(p) { return p.nombre.toLowerCase().includes(busqueda); }); }
            if (filtro) { proyectos = proyectos.filter(function(p) { return p.estado === filtro; }); }
            
            var grid = document.getElementById('proyectosGrid');
            if (proyectos.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:40px;">No hay proyectos</p>';
                return;
            }
            
            grid.innerHTML = proyectos.map(function(p) {
                var cliente = clientes.find(function(c) { return c.id === p.cliente_id; });
                return '<div class="card">' +
                    '<h3>' + p.nombre + ' <span class="badge ' + (p.estado||'').replace(' ','.') + '">' + p.estado + '</span></h3>' +
                    '<p><strong>Cliente:</strong> ' + (cliente ? cliente.nombre : 'Sin cliente') + '</p>' +
                    '<p><strong>Prioridad:</strong> <span class="badge ' + (p.prioridad||'') + '">' + p.prioridad + '</span></p>' +
                    '<p><strong>Presupuesto:</strong> ' + (p.presupuesto_cup||0).toLocaleString('es-ES') + ' ' + (p.moneda||'CUP') + '</p>' +
                    '<div class="card-actions">' +
                        '<button style="background:#2980b9;color:white;" onclick="editar(\'' + p.id + '\')">✏️ Editar</button>' +
                        '<button style="background:#f39c12;color:white;" onclick="cambiarEstado(\'' + p.id + '\')">🔄 Estado</button>' +
                    '</div>' +
                '</div>';
            }).join('');
        }
        
        function abrirModal() {
            document.getElementById('modalTitulo').textContent = '➕ Nuevo Proyecto';
            document.getElementById('proyectoId').value = '';
            document.getElementById('nombre').value = '';
            document.getElementById('estado').value = 'Pendiente';
            document.getElementById('prioridad').value = 'Media';
            document.getElementById('moneda').value = 'CUP';
            document.getElementById('fecha_inicio').value = '';
            document.getElementById('fecha_fin').value = '';
            document.getElementById('presupuesto_cup').value = '';
            document.getElementById('presupuesto_usd').value = '';
            document.getElementById('descripcion').value = '';
            
            var clientes = STORAGE.buscar('clientes', 'proyecto', usuarioActual.proyecto);
            var select = document.getElementById('cliente_id');
            select.innerHTML = '<option value="">Sin cliente</option>';
            clientes.forEach(function(c) { select.innerHTML += '<option value="' + c.id + '">' + c.nombre + '</option>'; });
            
            document.getElementById('modalProyecto').classList.add('show');
        }
        
        function cerrarModal() { document.getElementById('modalProyecto').classList.remove('show'); }
        
        function editar(id) {
            var p = STORAGE.buscarPorId('proyectos', id);
            if (!p) return;
            
            document.getElementById('modalTitulo').textContent = '✏️ Editar Proyecto';
            document.getElementById('proyectoId').value = p.id;
            document.getElementById('nombre').value = p.nombre || '';
            document.getElementById('estado').value = p.estado || 'Pendiente';
            document.getElementById('prioridad').value = p.prioridad || 'Media';
            document.getElementById('moneda').value = p.moneda || 'CUP';
            document.getElementById('fecha_inicio').value = p.fecha_inicio || '';
            document.getElementById('fecha_fin').value = p.fecha_fin || '';
            document.getElementById('presupuesto_cup').value = p.presupuesto_cup || '';
            document.getElementById('presupuesto_usd').value = p.presupuesto_usd || '';
            document.getElementById('descripcion').value = p.descripcion || '';
            
            var clientes = STORAGE.buscar('clientes', 'proyecto', usuarioActual.proyecto);
            var select = document.getElementById('cliente_id');
            select.innerHTML = '<option value="">Sin cliente</option>';
            clientes.forEach(function(c) { select.innerHTML += '<option value="' + c.id + '"' + (c.id === p.cliente_id ? ' selected' : '') + '>' + c.nombre + '</option>'; });
            
            document.getElementById('modalProyecto').classList.add('show');
        }
        
        function guardar() {
            var id = document.getElementById('proyectoId').value;
            var datos = {
                proyecto: usuarioActual.proyecto,
                nombre: document.getElementById('nombre').value,
                cliente_id: document.getElementById('cliente_id').value,
                estado: document.getElementById('estado').value,
                prioridad: document.getElementById('prioridad').value,
                moneda: document.getElementById('moneda').value,
                fecha_inicio: document.getElementById('fecha_inicio').value,
                fecha_fin: document.getElementById('fecha_fin').value,
                presupuesto_cup: parseFloat(document.getElementById('presupuesto_cup').value) || 0,
                presupuesto_usd: parseFloat(document.getElementById('presupuesto_usd').value) || 0,
                descripcion: document.getElementById('descripcion').value
            };
            
            if (id) { STORAGE.actualizar('proyectos', id, datos); }
            else { STORAGE.agregar('proyectos', datos); }
            
            cerrarModal();
            cargar();
        }
        
        function cambiarEstado(id) {
            var estados = ['Pendiente', 'En Progreso', 'Completado', 'Cancelado'];
            var nuevo = prompt('Nuevo estado:\n' + estados.join(', '));
            if (nuevo && estados.indexOf(nuevo) >= 0) {
                STORAGE.actualizar('proyectos', id, { estado: nuevo });
                cargar();
            }
        }
        
        function cerrarSesion() {
            localStorage.removeItem('erp_sesion');
            sessionStorage.removeItem('erp_sesion');
            window.location.href = 'login.html';
        }
        
        cargar();
    </script>
</body>
</html>
