<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ERP Cuba</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 450px; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .header { text-align: center; margin-bottom: 25px; }
        .logo { font-size: 48px; }
        h2 { color: #1a5276; margin: 10px 0; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        .form-group input { width: 100%; padding: 13px; border: 2px solid #ddd; border-radius: 10px; font-size: 15px; }
        .btn { width: 100%; padding: 15px; background: #1a5276; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; }
        .btn:active { background: #154360; }
        .mensaje { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; }
        .error { background: #fadbd8; color: #c0392b; }
        .success { background: #d5f5e3; color: #27ae60; }
        .links { text-align: center; margin-top: 15px; }
        .links a { color: #2980b9; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo">🇨🇺🏗️</div>
                <h2>Iniciar Sesión</h2>
                <p style="color: #666; font-size: 14px;">Proyecto Bernal • Ke Proyecto</p>
            </div>
            
            <div class="form-group">
                <label>📧 Correo Electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com">
            </div>
            
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" id="recordar"> Recordar sesión
                </label>
            </div>
            
            <button type="button" class="btn" id="btnLogin">
                🚀 INICIAR SESIÓN
            </button>
            
            <div id="mensaje"></div>
            
            <div class="links">
                <a href="index.html">⬅ Volver</a> |
                <a href="registro.html">📝 Crear cuenta</a>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script>
        // Verificar si ya hay sesión guardada
        (function() {
            var sesion = localStorage.getItem('erp_sesion');
            if (sesion) {
                var datos = JSON.parse(sesion);
                document.getElementById('email').value = datos.email || '';
                document.getElementById('recordar').checked = true;
            }
        })();

        document.getElementById('btnLogin').addEventListener('click', function() {
            
            var email = document.getElementById('email').value.trim().toLowerCase();
            var password = document.getElementById('password').value;
            var recordar = document.getElementById('recordar').checked;
            var msg = document.getElementById('mensaje');
            
            if (!email || !password) {
                msg.textContent = '❌ Completa todos los campos';
                msg.className = 'mensaje error';
                return;
            }
            
            // Buscar usuario
            var usuarios = STORAGE.leer('usuarios');
            var usuario = usuarios.find(function(u) { 
                return u.email.toLowerCase() === email && u.password === password && u.activo !== false;
            });
            
            if (usuario) {
                msg.textContent = '✅ ¡Bienvenido ' + usuario.nombre + '!';
                msg.className = 'mensaje success';
                
                var sesion = {
                    id: usuario.id,
                    email: usuario.email,
                    nombre: usuario.nombre,
                    telefono: usuario.telefono,
                    proyecto: usuario.proyecto,
                    rol: usuario.rol,
                    timestamp: new Date().getTime()
                };
                
                if (recordar) {
                    localStorage.setItem('erp_sesion', JSON.stringify(sesion));
                } else {
                    sessionStorage.setItem('erp_sesion', JSON.stringify(sesion));
                }
                
                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1000);
                
            } else {
                msg.textContent = '❌ Email o contraseña incorrectos';
                msg.className = 'mensaje error';
            }
        });
    </script>
</body>
</html>
