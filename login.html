<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ERP Cuba</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-container { width: 100%; max-width: 450px; }
        .login-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .login-header { text-align: center; margin-bottom: 25px; }
        .logo-icon { font-size: 48px; }
        h2 { color: #1a5276; margin: 10px 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 10px; font-size: 15px; }
        .btn { width: 100%; padding: 16px; background: #1a5276; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .mensaje { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; }
        .mensaje.error { background: #fadbd8; color: #c0392b; }
        .mensaje.success { background: #d5f5e3; color: #27ae60; }
        .volver { text-align: center; margin-top: 15px; }
        .volver a { color: #2980b9; text-decoration: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">🔐</div>
                <h2>Iniciar Sesión</h2>
            </div>
            
            <div class="form-group">
                <label>📧 Correo Electrónico</label>
                <input type="email" id="loginEmail" placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="recordar"> Recordar sesión</label>
            </div>
            
            <button class="btn" id="btnLogin">🚀 INICIAR SESIÓN</button>
            <div id="mensaje" class="mensaje"></div>
            
            <div class="volver">
                <a href="index.html">⬅ Volver</a>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kmsqhldejyxyqtfrmvov.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imttc3FobGRlanl4eXF0ZnJtdm92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMzM4MDMsImV4cCI6MjA5MTYwOTgwM30.V8Ec5fAk22VPS1a2bBh0rAWiNcWt6Y6dBzgTAK8ImZs';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('btnLogin').addEventListener('click', async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const recordar = document.getElementById('recordar').checked;
            const mensaje = document.getElementById('mensaje');
            
            if (!email || !password) {
                mensaje.textContent = '❌ Completa todos los campos';
                mensaje.className = 'mensaje error';
                return;
            }
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                
                const { data: perfil } = await supabase.from('perfiles').select('*').eq('email', email).single();
                
                if (perfil) {
                    const sessionData = { email: perfil.email, nombre: perfil.nombre_completo, proyecto: perfil.proyecto_asignado, rol: perfil.rol };
                    if (recordar) localStorage.setItem('erp_session', JSON.stringify(sessionData));
                    else sessionStorage.setItem('erp_session', JSON.stringify(sessionData));
                    
                    mensaje.textContent = '✅ ¡Bienvenido! Redirigiendo...';
                    mensaje.className = 'mensaje success';
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                }
            } catch (error) {
                mensaje.textContent = '❌ Email o contraseña incorrectos';
                mensaje.className = 'mensaje error';
            }
        });
    </script>
</body>
</html>
