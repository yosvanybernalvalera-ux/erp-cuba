<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Cuba - Acceso</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }
        .login-container { width: 100%; max-width: 450px; }
        .login-card { 
            background: white; 
            border-radius: 20px; 
            padding: 40px 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
            text-align: center;
        }
        .logo-icon { font-size: 60px; margin-bottom: 15px; }
        h1 { color: #1a5276; font-size: 24px; margin-bottom: 5px; }
        .subtitulo { color: #666; font-size: 14px; margin-bottom: 30px; }
        .btn { 
            display: block; 
            width: 100%; 
            padding: 18px; 
            border: none; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 15px; 
            text-decoration: none;
            color: white;
        }
        .btn-login { background: #1a5276; }
        .btn-registro { background: #27ae60; }
        .login-footer { margin-top: 25px; color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-icon">🇨🇺🏗️</div>
            <h1>ERP Empresarial Cuba</h1>
            <p class="subtitulo">Proyecto Bernal • Ke Proyecto</p>
            
            <a href="login.html" class="btn btn-login">🔐 INICIAR SESIÓN</a>
            <a href="registro.html" class="btn btn-registro">📝 CREAR CUENTA</a>
            
            <div class="login-footer">
                <p>🇨🇺 Hecho en Cuba • Sin costo • Datos seguros</p>
            </div>
        </div>
    </div>
</body>
</html>
