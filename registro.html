<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - ERP Cuba</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #27ae60 0%, #1a5276 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 450px; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { color: #27ae60; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 13px; border: 2px solid #ddd; border-radius: 10px; font-size: 15px; }
        .btn { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:active { background: #1e8449; }
        .mensaje { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; }
        .error { background: #fadbd8; color: #c0392b; }
        .success { background: #d5f5e3; color: #27ae60; }
        .info { background: #d6eaf8; color: #2980b9; }
        .volver { text-align: center; margin-top: 15px; }
        .volver a { color: #2980b9; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h2>📝 Crear Cuenta</h2>
                <p style="color: #666; font-size: 14px;">Proyecto Bernal • Ke Proyecto</p>
            </div>
            
            <div class="form-group">
                <label>👤 Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Ej: Juan Pérez García">
            </div>
            
            <div class="form-group">
                <label>📧 Correo Electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com">
            </div>
            
            <div class="form-group">
                <label>📱 Teléfono</label>
                <input type="tel" id="telefono" placeholder="+5351234567">
            </div>
            
            <div class="form-group">
                <label>🏢 Proyecto</label>
                <select id="proyecto">
                    <option value="">Selecciona tu proyecto...</option>
                    <option value="Proyecto Bernal">🏗️ Proyecto Bernal</option>
                    <option value="Ke Proyecto">🔥 Ke Proyecto</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres">
            </div>
            
            <div class="form-group">
                <label>🔒 Confirmar Contraseña</label>
                <input type="password" id="confirm" placeholder="Repite tu contraseña">
            </div>
            
            <button type="button" class="btn" id="btnCrear">
                ✅ CREAR CUENTA GRATIS
            </button>
            
            <div id="mensaje"></div>
            
            <div class="volver">
                <a href="index.html">⬅ Volver al inicio</a>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script>
        document.getElementById('btnCrear').addEventListener('click', function() {
            
            var nombre = document.getElementById('nombre').value.trim();
            var email = document.getElementById('email').value.trim();
            var telefono = document.getElementById('telefono').value.trim();
            var proyecto = document.getElementById('proyecto').value;
            var password = document.getElementById('password').value;
            var confirm = document.getElementById('confirm').value;
            var msg = document.getElementById('mensaje');
            
            // Validar
            if (!nombre || !email || !telefono || !proyecto || !password) {
                msg.textContent = '❌ Completa todos los campos';
                msg.className = 'mensaje error';
                return;
            }
            
            if (password !== confirm) {
                msg.textContent = '❌ Las contraseñas no coinciden';
                msg.className = 'mensaje error';
                return;
            }
            
            if (password.length < 6) {
                msg.textContent = '❌ Mínimo 6 caracteres';
                msg.className = 'mensaje error';
                return;
            }
            
            // Verificar si el email ya existe
            var usuarios = STORAGE.leer('usuarios');
            var existe = usuarios.find(function(u) { return u.email === email; });
            
            if (existe) {
                msg.textContent = '❌ Este email ya está registrado';
                msg.className = 'mensaje error';
                return;
            }
            
            // Crear usuario
            var nuevoUsuario = {
                email: email,
                password: password,
                nombre: nombre,
                telefono: telefono,
                proyecto: proyecto,
                rol: 'Usuario',
                activo: true
            };
            
            STORAGE.agregar('usuarios', nuevoUsuario);
            
            msg.textContent = '✅ ¡Cuenta creada! Redirigiendo...';
            msg.className = 'mensaje success';
            
            setTimeout(function() {
                window.location.href = 'login.html';
            }, 1500);
        });
    </script>
</body>
</html>
