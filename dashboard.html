<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ERP Cuba</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #1a5276; --dark: #2c3e50; --light: #ecf0f1; --success: #27ae60; --warning: #f39c12; --danger: #c0392b; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--light); }
        .app { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--dark); color: white; position: fixed; height: 100vh; left: 0; top: 0; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h3 { font-size: 16px; }
        .sidebar-header small { opacity: 0.7; font-size: 12px; }
        .sidebar-nav { flex: 1; padding: 15px 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .sidebar-footer { padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .btn-logout { width: 100%; padding: 10px; background: rgba(255,255,255,0.1); color: white; border: none; border-radius: 8px; cursor: pointer; }
        .btn-logout:hover { background: var(--danger); }
        
        /* Main */
        .main { flex: 1; margin-left: 260px; padding: 20px; }
        .topbar { background: white; padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .topbar h1 { font-size: 20px; color: var(--dark); }
        .user-info { font-size: 14px; color: #666; }
        
        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-icon { font-size: 36px; background: var(--light); width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
        .stat-info h3 { font-size: 24px; color: var(--dark); }
        .stat-info p { font-size: 13px; color: #666; }
        
        /* Table */
        .section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .section h2 { font-size: 18px; margin-bottom: 15px; color: var(--dark); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
        th { background: var(--light); font-weight: 600; }
        .badge { padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; }
        .badge.activo { background: #d5f5e3; color: var(--success); }
        .badge.pendiente { background: #fdebd0; color: var(--warning); }
        .badge.progreso { background: #d6eaf8; color: #2980b9; }
        .badge.completado { background: #d5f5e3; color: var(--success); }
        .badge.alta { background: #fadbd8; color: var(--danger); }
        
        .menu-btn { display: none; background: none; border: none; font-size: 24px; cursor: pointer; }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-260px); transition: 0.3s; }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; }
            .menu-btn { display: block; }
            .stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3 id="proyectoNombre">🇨🇺 ERP Cuba</h3>
                <small id="userNombre"></small>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item active">📊 Dashboard</a>
                <a href="clientes.html" class="nav-item">👥 Clientes</a>
                <a href="trabajadores.html" class="nav-item">👷 Trabajadores</a>
                <a href="proyectos.html" class="nav-item">🏗️ Proyectos</a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout" onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
            </div>
        </aside>
        
        <main class="main" id="mainContent">
            <div class="topbar">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <h1>📊 Dashboard</h1>
                <div class="user-info">
                    <span id="fechaActual"></span> |
                    <button onclick="exportarDatos()" style="background:#27ae60;color:white;border:none;padding:8px 15px;border-radius:6px;cursor:pointer;">📥 Exportar Datos</button>
                </div>
            </div>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-icon">🏗️</div>
                    <div class="stat-info">
                        <h3 id="totalProyectos">0</h3>
                        <p>Proyectos</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-info">
                        <h3 id="totalClientes">0</h3>
                        <p>Clientes</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👷</div>
                    <div class="stat-info">
                        <h3 id="totalTrabajadores">0</h3>
                        <p>Trabajadores</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-info">
                        <h3 id="totalPresupuesto">0 CUP</h3>
                        <p>Presupuesto</p>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <h2>📋 Proyectos Recientes</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Proyecto</th>
                            <th>Cliente</th>
                            <th>Estado</th>
                            <th>Prioridad</th>
                            <th>Presupuesto</th>
                        </tr>
                    </thead>
                    <tbody id="proyectosBody">
                        <tr><td colspan="5" style="text-align:center;">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script>
        var usuarioActual = null;
        
        // Verificar sesión
        function verificarSesion() {
            var sesion = localStorage.getItem('erp_sesion') || sessionStorage.getItem('erp_sesion');
            if (!sesion) { window.location.href = 'login.html'; return; }
            try {
                usuarioActual = JSON.parse(sesion);
                document.getElementById('proyectoNombre').textContent = usuarioActual.proyecto || 'ERP Cuba';
                document.getElementById('userNombre').textContent = usuarioActual.nombre;
            } catch(e) { window.location.href = 'login.html'; }
        }
        
        // Actualizar fecha
        function actualizarFecha() {
            var ahora = new Date();
            var opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('fechaActual').textContent = ahora.toLocaleDateString('es-ES', opciones);
        }
        
        // Cargar dashboard
        function cargarDashboard() {
            var proyecto = usuarioActual.proyecto;
            
            // Estadísticas
            var proyectos = STORAGE.buscar('proyectos', 'proyecto', proyecto);
            var clientes = STORAGE.buscar('clientes', 'proyecto', proyecto);
            var trabajadores = STORAGE.buscar('trabajadores', 'proyecto', proyecto);
            
            document.getElementById('totalProyectos').textContent = proyectos.length;
            document.getElementById('totalClientes').textContent = clientes.filter(function(c){ return c.activo !== false; }).length;
            document.getElementById('totalTrabajadores').textContent = trabajadores.filter(function(t){ return t.activo !== false; }).length;
            
            var totalPresupuesto = proyectos.reduce(function(sum, p){ return sum + (p.presupuesto_cup || 0); }, 0);
            document.getElementById('totalPresupuesto').textContent = totalPresupuesto.toLocaleString('es-ES') + ' CUP';
            
            // Tabla de proyectos
            var tbody = document.getElementById('proyectosBody');
            if (proyectos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No hay proyectos</td></tr>';
                return;
            }
            
            tbody.innerHTML = proyectos.slice(0, 10).map(function(p) {
                var cliente = clientes.find(function(c){ return c.id === p.cliente_id; });
                var estadoClase = p.estado === 'En Progreso' ? 'progreso' : p.estado.toLowerCase().replace(' ', '');
                return '<tr>' +
                    '<td><strong>' + (p.nombre || '') + '</strong></td>' +
                    '<td>' + (cliente ? cliente.nombre : 'Sin cliente') + '</td>' +
                    '<td><span class="badge ' + estadoClase + '">' + (p.estado || '') + '</span></td>' +
                    '<td><span class="badge ' + (p.prioridad || '').toLowerCase() + '">' + (p.prioridad || '') + '</span></td>' +
                    '<td>' + (p.presupuesto_cup || 0).toLocaleString('es-ES') + ' ' + (p.moneda || 'CUP') + '</td>' +
                '</tr>';
            }).join('');
        }
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
        
        function cerrarSesion() {
            localStorage.removeItem('erp_sesion');
            sessionStorage.removeItem('erp_sesion');
            window.location.href = 'login.html';
        }
        
        function exportarDatos() {
            STORAGE.exportar();
        }
        
        // Iniciar
        verificarSesion();
        actualizarFecha();
        cargarDashboard();
    </script>
</body>
</html>
