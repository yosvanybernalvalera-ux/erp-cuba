<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajadores - ERP Cuba</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #1a5276; --dark: #2c3e50; --light: #ecf0f1; --success: #27ae60; --danger: #c0392b; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--light); }
        .app { display: flex; min-height: 100vh; }
        
        .sidebar { width: 260px; background: var(--dark); color: white; position: fixed; height: 100vh; left: 0; top: 0; z-index: 100; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h3 { font-size: 16px; }
        .sidebar-header small { opacity: 0.7; font-size: 12px; }
        .sidebar-nav { padding: 15px 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .sidebar-footer { padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.1); position: absolute; bottom: 0; width: 100%; }
        .btn-logout { width: 100%; padding: 10px; background: rgba(255,255,255,0.1); color: white; border: none; border-radius: 8px; cursor: pointer; }
        .btn-logout:hover { background: var(--danger); }
        
        .main { flex: 1; margin-left: 260px; padding: 20px; }
        .topbar { background: white; padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .topbar h1 { font-size: 20px; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .stat-card h3 { font-size: 22px; color: var(--dark); }
        .stat-card p { font-size: 12px; color: #666; }
        
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-bar input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
        th { background: var(--light); }
        .badge { padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; }
        .badge.activo { background: #d5f5e3; color: var(--success); }
        .badge.inactivo { background: #e0e0e0; color: #666; }
        .btn-icon { background: none; border: none; font-size: 16px; cursor: pointer; margin: 0 3px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; max-width: 550px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-secondary { background: #95a5a6; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
        .menu-btn { display: none; background: none; border: none; font-size: 24px; cursor: pointer; }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-260px); transition: 0.3s; }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; }
            .menu-btn { display: block; }
            .form-row { grid-template-columns: 1fr; }
            .stats { grid-template-columns: 1fr; }
            .search-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3 id="proyectoNombre">🇨🇺 ERP Cuba</h3>
                <small id="userNombre"></small>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="clientes.html" class="nav-item">👥 Clientes</a>
                <a href="trabajadores.html" class="nav-item active">👷 Trabajadores</a>
                <a href="proyectos.html" class="nav-item">🏗️ Proyectos</a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout" onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
            </div>
        </aside>
        
        <main class="main">
            <div class="topbar">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <h1>👷 Gestión de Trabajadores</h1>
                <button class="btn-primary" onclick="abrirModal()">➕ Nuevo Trabajador</button>
            </div>
            
            <div class="stats">
                <div class="stat-card"><h3 id="totalActivos">0</h3><p>Trabajadores Activos</p></div>
                <div class="stat-card"><h3 id="tarifaPromedio">0 CUP</h3><p>Tarifa Promedio/h</p></div>
                <div class="stat-card"><h3 id="totalAsignados">0</h3><p>En Proyectos</p></div>
            </div>
            
            <div class="search-bar">
                <input type="text" id="busqueda" placeholder="🔍 Buscar trabajador..." onkeyup="cargarTrabajadores()">
            </div>
            
            <div class="section">
                <table>
                    <thead>
                        <tr><th>Nombre</th><th>Especialidad</th><th>Tarifa (CUP/h)</th><th>Teléfono</th><th>Estado</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="trabajadoresBody"></tbody>
                </table>
            </div>
        </main>
    </div>
    
    <div class="modal" id="modalTrabajador">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitulo">➕ Nuevo Trabajador</h2>
                <button class="modal-close" onclick="cerrarModal()">&times;</button>
            </div>
            <form id="formTrabajador" onsubmit="return false;">
                <input type="hidden" id="trabajadorId">
                <div class="form-row">
                    <div class="form-group"><label>👤 Nombre *</label><input type="text" id="nombre" required></div>
                    <div class="form-group"><label>👤 Apellidos *</label><input type="text" id="apellidos" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>🆔 Carnet</label><input type="text" id="carnet"></div>
                    <div class="form-group"><label>📱 Teléfono</label><input type="tel" id="telefono"></div>
                </div>
                <div class="form-group"><label>📧 Email</label><input type="email" id="email"></div>
                <div class="form-row">
                    <div class="form-group"><label>🔧 Especialidad</label><input type="text" id="especialidad"></div>
                    <div class="form-group"><label>💰 Tarifa Hora (CUP)</label><input type="number" id="tarifa_cup" step="0.01"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>💵 Tarifa Hora (USD)</label><input type="number" id="tarifa_usd" step="0.01"></div>
                    <div class="form-group"><label>📅 Tarifa Día (CUP)</label><input type="number" id="tarifa_dia" step="0.01"></div>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="activo" checked> Trabajador Activo</label>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-primary" onclick="guardarTrabajador()">💾 Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script>
        var usuarioActual = null;
        
        function verificarSesion() {
            var sesion = localStorage.getItem('erp_sesion') || sessionStorage.getItem('erp_sesion');
            if (!sesion) { window.location.href = 'login.html'; return; }
            usuarioActual = JSON.parse(sesion);
            document.getElementById('proyectoNombre').textContent = usuarioActual.proyecto;
            document.getElementById('userNombre').textContent = usuarioActual.nombre;
        }
        
        function cargarTrabajadores() {
            var busqueda = document.getElementById('busqueda').value.toLowerCase();
            var trabajadores = STORAGE.buscar('trabajadores', 'proyecto', usuarioActual.proyecto);
            
            if (busqueda) {
                trabajadores = trabajadores.filter(function(t) {
                    return (t.nombre + ' ' + t.apellidos).toLowerCase().includes(busqueda) ||
                           (t.especialidad || '').toLowerCase().includes(busqueda);
                });
            }
            
            // Estadísticas
            var activos = trabajadores.filter(function(t){ return t.activo !== false; });
            document.getElementById('totalActivos').textContent = activos.length;
            
            var tarifas = activos.filter(function(t){ return t.tarifa_hora_cup > 0; });
            var promedio = tarifas.length > 0 ? tarifas.reduce(function(s, t){ return s + t.tarifa_hora_cup; }, 0) / tarifas.length : 0;
            document.getElementById('tarifaPromedio').textContent = promedio.toFixed(2) + ' CUP';
            document.getElementById('totalAsignados').textContent = '0';
            
            // Tabla
            var tbody = document.getElementById('trabajadoresBody');
            if (trabajadores.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No hay trabajadores</td></tr>';
                return;
            }
            
            tbody.innerHTML = trabajadores.map(function(t) {
                return '<tr>' +
                    '<td><strong>' + (t.nombre || '') + ' ' + (t.apellidos || '') + '</strong></td>' +
                    '<td>' + (t.especialidad || '-') + '</td>' +
                    '<td>' + (t.tarifa_hora_cup || 0).toFixed(2) + ' CUP</td>' +
                    '<td>' + (t.telefono || '-') + '</td>' +
                    '<td><span class="badge ' + (t.activo !== false ? 'activo' : 'inactivo') + '">' + (t.activo !== false ? 'Activo' : 'Inactivo') + '</span></td>' +
                    '<td>' +
                        '<button class="btn-icon" onclick="editarTrabajador(\'' + t.id + '\')">✏️</button>' +
                        '<button class="btn-icon" onclick="toggleTrabajador(\'' + t.id + '\')">' + (t.activo !== false ? '🔴' : '🟢') + '</button>' +
                    '</td>' +
                '</tr>';
            }).join('');
        }
        
        function abrirModal() {
            document.getElementById('modalTitulo').textContent = '➕ Nuevo Trabajador';
            document.getElementById('formTrabajador').reset();
            document.getElementById('trabajadorId').value = '';
            document.getElementById('modalTrabajador').classList.add('active');
        }
        
        function cerrarModal() { document.getElementById('modalTrabajador').classList.remove('active'); }
        
        function editarTrabajador(id) {
            var trabajadores = STORAGE.todos('trabajadores');
            var t = trabajadores.find(function(x) { return x.id === id; });
            if (!t) return;
            
            document.getElementById('modalTitulo').textContent = '✏️ Editar Trabajador';
            document.getElementById('trabajadorId').value = t.id;
            document.getElementById('nombre').value = t.nombre || '';
            document.getElementById('apellidos').value = t.apellidos || '';
            document.getElementById('carnet').value = t.carnet_identidad || '';
            document.getElementById('telefono').value = t.telefono || '';
            document.getElementById('email').value = t.email || '';
            document.getElementById('especialidad').value = t.especialidad || '';
            document.getElementById('tarifa_cup').value = t.tarifa_hora_cup || '';
            document.getElementById('tarifa_usd').value = t.tarifa_hora_usd || '';
            document.getElementById('tarifa_dia').value = t.tarifa_dia || '';
            document.getElementById('activo').checked = t.activo !== false;
            document.getElementById('modalTrabajador').classList.add('active');
        }
        
        function guardarTrabajador() {
            var id = document.getElementById('trabajadorId').value;
            var datos = {
                proyecto: usuarioActual.proyecto,
                nombre: document.getElementById('nombre').value,
                apellidos: document.getElementById('apellidos').value,
                carnet_identidad: document.getElementById('carnet').value,
                telefono: document.getElementById('telefono').value,
                email: document.getElementById('email').value,
                especialidad: document.getElementById('especialidad').value,
                tarifa_hora_cup: parseFloat(document.getElementById('tarifa_cup').value) || 0,
                tarifa_hora_usd: parseFloat(document.getElementById('tarifa_usd').value) || 0,
                tarifa_dia: parseFloat(document.getElementById('tarifa_dia').value) || 0,
                activo: document.getElementById('activo').checked
            };
            
            if (id) { STORAGE.actualizar('trabajadores', id, datos); }
            else { STORAGE.agregar('trabajadores', datos); }
            
            cerrarModal();
            cargarTrabajadores();
        }
        
        function toggleTrabajador(id) {
            var trabajadores = STORAGE.todos('trabajadores');
            var t = trabajadores.find(function(x) { return x.id === id; });
            if (t) { STORAGE.actualizar('trabajadores', id, { activo: !(t.activo !== false) }); cargarTrabajadores(); }
        }
        
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function cerrarSesion() { localStorage.removeItem('erp_sesion'); sessionStorage.removeItem('erp_sesion'); window.location.href = 'login.html'; }
        
        verificarSesion();
        cargarTrabajadores();
    </script>
</body>
</html>
